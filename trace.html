<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace — Evidence Studio</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f8f7f4;
    --mid: rgba(248,247,244,0.14);
    --serif: 'EB Garamond', Georgia, serif;
    --mono: 'Courier Prime', 'Courier New', monospace;
    --helvetica: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  img, video { display: block; }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 2.25rem;
    background: linear-gradient(to bottom, rgba(10,10,10,0.8), transparent);
  }

  .nav-logo {
    font-family: var(--helvetica);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--white);
    text-decoration: none;
  }

  .nav-back {
    font-family: var(--mono);
    font-size: 0.56rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--white);
    text-decoration: none;
    opacity: 0.45;
    transition: opacity 0.25s;
  }

  .nav-back:hover { opacity: 1; }

  /* ── COVER ── */
  .cover {
    position: relative;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }

  .cover img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .cover::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10,10,10,0.9) 0%, transparent 50%);
    pointer-events: none;
  }

  .cover-content {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 0 2.25rem 3.5rem;
  }

  .cover-title {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(3rem, 11vw, 8.5rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
  }

  .cover-sub {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-top: 1rem;
  }

  /* ── SPEC ── */
  .spec {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 2rem 1.5rem;
    padding: clamp(3.5rem, 9vh, 6rem) 2.25rem;
    border-bottom: 1px solid var(--mid);
  }

  .spec dt {
    font-family: var(--mono);
    font-size: 0.54rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.35;
    margin-bottom: 0.5rem;
  }

  .spec dd {
    font-family: var(--serif);
    font-size: 1rem;
    line-height: 1.5;
  }

  /* ── SECTIONS ── */
  section { padding: clamp(3.5rem, 9vh, 6.5rem) 2.25rem; }

  .sec-label {
    font-family: var(--mono);
    font-size: 0.54rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.35;
    margin-bottom: 2rem;
  }

  .pair {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: clamp(1rem, 2.5vw, 2rem);
  }

  .pair img { width: 100%; height: auto; }

  .caption {
    font-family: var(--mono);
    font-size: 0.54rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.3;
    margin-top: 0.7rem;
  }

  /* fade-in on scroll */
  .rise { opacity: 0; transform: translateY(28px); transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22,1,0.36,1); }
  .rise.visible { opacity: 1; transform: none; }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--mid);
    padding: 3rem 2.25rem 4rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  footer a {
    color: var(--white);
    text-decoration: none;
    font-family: var(--mono);
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.5;
    transition: opacity 0.25s;
  }

  footer a:hover { opacity: 1; }

  @media (max-width: 640px) {
    .cover-content, nav, section, .spec, footer { padding-left: 1.25rem; padding-right: 1.25rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Evidence Studio</a>
  <a class="nav-back" href="index.html#reel">← All work</a>
</nav>

<!-- ── COVER ── -->
<header class="cover">
  <img src="images/trace/tr_light_cobalt.jpg" alt="Trace — bottle under a cobalt key"
       width="1800" height="1013" fetchpriority="high" decoding="async">
  <div class="cover-content">
    <h1 class="cover-title">Trace</h1>
    <p class="cover-sub">Exhibit No. 001 · Eau de Parfum</p>
  </div>
</header>

<!-- ── SPEC ── -->
<dl class="spec">
  <div><dt>Discipline</dt><dd>Product visualisation, identity</dd></div>
  <div><dt>Work</dt><dd>Modelling, look development, lighting, label artwork</dd></div>
  <div><dt>Year</dt><dd>2026</dd></div>
</dl>

<!-- ── STILLS ── -->
<section class="rise">
  <p class="sec-label">Stills</p>
  <div class="pair">
    <div>
      <img src="images/trace/tr_logotype.jpg" alt="Trace — logotype reading through the curve of the bottle"
           width="1800" height="1013" loading="lazy" decoding="async">
      <p class="caption">Logotype</p>
    </div>
    <div>
      <img src="images/trace/trace_poster.jpg" alt="Trace — bottle, neutral key"
           width="1400" height="1750" loading="lazy" decoding="async">
      <p class="caption">Neutral key</p>
    </div>
  </div>
</section>

<footer>
  <a href="index.html#reel">← All work</a>
  <a href="mailto:evidencestudiocontact@gmail.com">evidencestudiocontact@gmail.com</a>
</footer>

<script>
/* fade sections in as they arrive */
const io = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
}, { threshold: 0.12 });
document.querySelectorAll('.rise').forEach(el => io.observe(el));
</script>

</body>
</html>
